[package]
name = "radio-track-splitter"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "radio-track-splitter"
path = "src/bin/gui.rs"

[[bin]]
name = "radio-track-splitter-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
candle-core = "0.11.0"
candle-nn = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
hound = "3.5.1"
rfd = "0.17.2"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

# candle is far too slow unoptimised, so optimise dependencies even in debug/test builds.
[profile.dev.package."*"]
opt-level = 3
